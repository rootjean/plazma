services:
  web:
    build: .
    image: plazma-ideas
    container_name: plazma-ideas
    restart: unless-stopped
    ports:
      # host:contenedor — cambia el 3000 de la izquierda si el puerto está ocupado
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
